# This file generates the GitHub Actions matrix.
#
# SlabBoard: two nice!nano halves, BLE split, left half central.
# The right half carries the EC12 encoder and the nice!view display.
#
# Flash BOTH halves from the SAME workflow run — see config/west.yml for why.
# settings_reset is a ZMK utility image: flash it to a half to wipe stored
# Bluetooth bonds, then flash the real firmware back. Use it if the halves
# will not pair.

include:
  - board: nice_nano//zmk
    shield: slabboard_left
    snippet: studio-rpc-usb-uart

  - board: nice_nano//zmk
    shield: slabboard_right nice_view

  - board: nice_nano//zmk
    shield: settings_reset

  # Debug-only left half, for diagnosing the trackpad's boot-unstable axis
  # orientation (9 power cycles: 8 correct, 1 wrong -- see CLAUDE.md).
  #
  # The suspicion is that iqs5xx_init() writes config registers after a blind
  # 100 ms wait rather than waiting for the chip's RDY communication window, so
  # some writes do not land. The driver LOG_ERRs on every failed config write,
  # so a bad boot should say so directly.
  #
  # Logging goes to a USB CDC ACM device. The startup delay holds the log
  # processing thread for 8 s so boot-time messages are still buffered when you
  # attach a terminal -- without it, init is over before you can connect.
  #
  # The other three settings exist because the first attempt at this capture
  # came back empty. Buffering for 8 s only helps if the messages survive the
  # wait, and they did not: across 19 boots the zmk module logged 10974 lines
  # and the input subsystem 2939, against 32 from iqs5xx. That flood evicted
  # the init window from the ring buffer before the flush -- 21 "messages
  # dropped" notices, and every boot but the first began at ~7.8 s uptime.
  #
  #   ZMK_LOG_LEVEL_ERR     silences the 10974 zmk lines
  #   INPUT_LOG_LEVEL_INF   silences the input subsystem's per-event DBG spam
  #                         while keeping iqs5xx's own INF and ERR messages
  #                         (the driver registers under CONFIG_INPUT_LOG_LEVEL)
  #   LOG_BUFFER_SIZE       32 KB, up from ZMK's 8 KB default, for headroom
  #
  # NOT for daily use: logging costs battery, and this build drops the
  # studio-rpc-usb-uart snippet because only one snippet per entry is supported
  # (the workflow passes the value as a single -S argument).
  #
  # Artifact: slabboard_left_debug.uf2
  #
  # artifact-name is REQUIRED here, not cosmetic: this repo calls ZMK's
  # build-user-config.yml, whose default name is "<shield>-<board>-zmk". Both
  # slabboard_left entries would otherwise produce the same artifact name and
  # collide at upload. (ZMK's own build.yml has a `nickname` field for this --
  # build-user-config.yml does not, and silently ignores it.)
  - board: nice_nano//zmk
    shield: slabboard_left
    snippet: zmk-usb-logging
    cmake-args: >-
      -DCONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
      -DCONFIG_LOG_BUFFER_SIZE=32768
      -DCONFIG_ZMK_LOG_LEVEL_ERR=y
      -DCONFIG_INPUT_LOG_LEVEL_INF=y
    artifact-name: slabboard_left_debug
