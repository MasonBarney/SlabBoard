# Central half. Studio needs the physical layout in slabboard-layouts.dtsi
# and the studio-rpc-usb-uart snippet (see build.yaml).
CONFIG_ZMK_STUDIO=y

# Azoteq TPS65 trackpad on i2c0. The driver's own Kconfig defaults to y once
# its devicetree node exists, so it does not need enabling by name.
CONFIG_ZMK_POINTING=y
CONFIG_I2C=y
CONFIG_INPUT=y
