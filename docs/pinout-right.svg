<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-label="nice!nano v2 right half, viewed from the bottom with USB-C at the top. Left column top to bottom: RAW, GND, RST, VCC, then P0.31, P0.29, P0.02 and P1.15 as matrix columns 5, 4, 3 and 2, P1.13 spare, P1.11 as nice!view chip select, P0.10 as nice!view SCK, and P0.09 as matrix column 1. Right column top to bottom: P0.06 and P0.08 spare, two GND pins, P0.17 and P0.20 as EC12 encoder A and B, then P0.22, P0.24, P1.00, P0.11 and P1.04 as matrix rows 0 through 4, and P1.06 as matrix column 0.">
<style>
  .bg{fill:#f3f6f0}
  text{font-family:ui-monospace,"SF Mono","Cascadia Code",Consolas,monospace}
  .silk{font-size:13px;font-weight:700}
  .assign{font-size:12.5px;font-weight:600}
  .alias{font-size:9.5px;fill:#5c6d5f}
  .leader{stroke-width:1.4;fill:none}
  .leader.spare{stroke-dasharray:2 3}
  .pad{fill:#e3c07a;stroke:#0f1f15;stroke-width:.75}
  .dot{stroke:#f3f6f0;stroke-width:1.2}
  .row{stroke:#a83c3c;fill:#a83c3c}
  .col{stroke:#2b6690;fill:#2b6690}
  .i2c{stroke:#7a4fa3;fill:#7a4fa3}
  .spi{stroke:#1f7a5c;fill:#1f7a5c}
  .enc{stroke:#c2703a;fill:#c2703a}
  .neutral{stroke:#3f4d41;fill:#3f4d41}
  .spare{stroke:#8b9a8a;fill:#8b9a8a}
  .boardbody{fill:#1f3327;stroke:#0f1f15;stroke-width:1.5}
  .boardlabel{font-size:13px;fill:#e3c07a;letter-spacing:.04em}
  .usbnotch{fill:#0f1f15}
  .usblabel{font-size:8.5px;fill:#e3c07a;letter-spacing:.06em}
  .viewnote{font-size:10px;fill:#5c6d5f;letter-spacing:.08em}
</style>
